<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="add-food.css">
    <script src="add-food.js" defer></script>
</head>
<body>
    <header>
        <h1>🔥CalorieTrack</h1>

        <nav>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="log.html">Log</a></li>
                <li><a href="add-food.html" id="currentLink">Add Food</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>

        <img> <!-- DarkMode/LightMode -->
    </header>
    <main>
        <h1>Add Food</h1>

        <section id="searchSection" class="outline">
            <h2>Search Food</h2>
            <form id="searchForm">
                <input type="text" name="searchBar" placeholder="Search food...">
                <button class="reverseColor">Search</button>
            </form>
        </section>

        <section id="manualEntrySection" class="outline">
            <h2>Manual Entry</h2>
            <form id="manualEntryForm">
                <div class="full">
                    <label for="name">Food Name</label><br>
                    <input type="text" name="name" placeholder="e.g. Grilled Chicken">
                </div>
                <div>
                    <label for="name">Calories (kcal)</label><br>
                    <input type="number" name="name" placeholder="0">
                </div>
                <div>
                    <label for="name">Protein (g)</label><br>
                    <input type="number" name="name" placeholder="0">
                </div>
                <div>
                    <label for="name">Carbs (g)</label><br>
                    <input type="number" name="name" placeholder="0">
                </div>
                <div>
                    <label for="name">Fat (g)</label><br>
                    <input type="number" name="name" placeholder="0">
                </div>
                <div class="full">
                    <label for="mealType">Meal Type</label><br>

                    <input type="radio" name="mealType" value="breakfast" id="breakfast">
                    <label for="breakfast">Breakfast</label>

                    <input type="radio" name="mealType" value="lunch" id="lunch">
                    <label for="lunch">Lunch</label>

                    <input type="radio" name="mealType" value="dinner" id="dinner">
                    <label for="dinner">Dinner</label>

                    <input type="radio" name="mealType" value="snack" id="snack">
                    <label for="snack">Snack</label>
                </div>
                <button type="submit" id="addFoodButton" class="reverseColor full">+ Add Food</button>
            </form>
        </section>
    </main>
</body>
</html>
