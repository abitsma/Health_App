<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>

    <header>
        <h1>🔥CalorieTrack</h1>

        <nav>
            <ul>
                <li><a href="index.html" id="currentLink">Dashboard</a></li>
                <li><a href="log.html">Log</a></li>
                <li><a href="add-food.html">Add Food</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>

        <img> <!-- DarkMode/LightMode -->
    </header>

    <main>
        <section id="heading">
            <h1>Dashboard</h1>
            <p id="date">Day, Month #, 20XX</p>
        </section>

        <section class="widget" id="summary">
            <h2>Today's Summary</h2>
            <p class="calorieCount"><strong>X,XXX</strong> / X,XXX</p>
            <p class="remainingCalories">xxx kcal remaining</p>

            <div id="macros">
                <section class="macro" id="proteinMacro">
                    <div class="dot" id="blueDot"></div>
                    <h3>Protein</h3>
                    <p><strong>xx</strong>g</p>
                </section>
                <section class="macro" id="carbMacro">
                    <div class="dot" id="yellowDot"></div>
                    <h3>Carbs</h3>
                    <p><strong>xx</strong>g</p>
                </section>
                <section class="macro" id="fatMacro">
                    <div class="dot" id="redDot"></div>
                    <h3>Fat</h3>
                    <p><strong>xx</strong>g</p>
                </section>
            </div>
            
        </section>

        <section class="widget" id="dailyProgress">
            <h2>Daily Progress</h2>
            <p class="percentOfGoal">XX% of daily goal</p>
            <p class="rightAlign fractionalProgress">x,xxx / x,xxx kcal</p>
            <div class="progressBar" id="dailyProgressBar"><div></div></div>
            <p>0</p>
            <p class="rightAlign barCalCount">x,xxx kcal</p>
        </section>

        <section class="widget" id="quickActions">
            <h2>Quick Actions</h2>
            <div id="quickActionButtons">
                <button type="button" class="reverseColor" id="addFoodButton">+ Add Food</button>
                <button type="button" id="viewLogButton">View Log</button>
            </div>
        </section>

        <section class="widget" id="mealsOverview">
            <h2>Meals Overview</h2>

            <div id="mealOverviews">
                <!-- This is what a meal overview would look like

                <section class="mealOverview">
                    <div class="mealOverviewHeader">
                        <h3>Breakfast</h3>
                        <p class="rightAlign total">xxx kcal</p>
                    </div>
                    <div class="foodItems">
                        <div class="foodItem">
                            <p>Food Name</p>
                            <p class="rightAlign">xxx</p>
                        </div>
                        <p class="noFoodItem">Nothing logged</p>
                    </div>
                    <button type="button" class="mealAddButton">+ Add</button>
                </section>

                -->
            </div>
            
        </section>

    </main>
</body>
</html>
